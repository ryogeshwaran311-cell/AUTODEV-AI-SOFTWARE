services:
  # 1. AutoDevAI Platform (Main Engine)
  - type: web
    name: autodevai-platform
    runtime: python
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "python backend/app.py"
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_DIR
        value: "projects"

  # Independent App: build-calci
  - type: web
    name: build-calci-app
    runtime: python
    rootDir: projects/build-calci
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "python backend/app.py"
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "true"

